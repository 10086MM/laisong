<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>两宋文化地图 · 城市更新中的文化传承</title>
  <link rel="stylesheet" href="css/landing.css">
</head>
<body class="page-home">
  <header class="home-nav">
    <div class="home-nav-brand">两宋文化地图</div>
    <a class="home-nav-cta" href="map.html">进入地图</a>
  </header>

  <!-- 首屏：品牌 + 整体主视觉 -->
  <section class="home-hero">
    <div class="home-hero-visual" aria-hidden="true">
      <img class="home-hero-img" src="image/hero-song.jpg" alt="" decoding="async" fetchpriority="high">
      <div class="home-hero-veil"></div>
    </div>
    <div class="home-hero-copy">
      <p class="home-hero-place">开封 · 杭州 · 两宋都城</p>
      <h1 class="home-hero-brand">两宋文化地图</h1>
      <p class="home-hero-sub">在城市更新里，重新遇见宋韵</p>
      <a class="home-hero-cta" href="map.html">开启寻宋之旅</a>
    </div>
    <div class="home-hero-scroll" aria-hidden="true">向下了解</div>
  </section>

  <section class="home-story">
    <p class="home-story-kicker">为何做这张地图</p>
    <h2 class="home-story-title">汴水与钱塘之间，<br>是两座都城的千年回响</h2>
    <p class="home-story-text">
      开封曾是北宋东京，杭州曾是南宋临安。本站把仍可亲见的宋韵地标、
      遗址展示与城市更新现场放在同一张图上，让「文化传承」不只是口号，而能走到现场。
    </p>
  </section>

  <section class="home-cities">
    <a class="home-city home-city--kf" href="map.html?city=kaifeng">
      <img src="image/thumbs/intro-kaifeng.jpg" alt="开封铁塔" loading="lazy" decoding="async">
      <div class="home-city-veil"></div>
      <div class="home-city-copy">
        <span>北宋都城</span>
        <strong>开封</strong>
        <em>从铁塔走进东京汴梁</em>
      </div>
    </a>
    <a class="home-city home-city--hz" href="map.html?city=hangzhou">
      <img src="image/thumbs/intro-hangzhou.jpg" alt="杭州六和塔" loading="lazy" decoding="async">
      <div class="home-city-veil"></div>
      <div class="home-city-copy">
        <span>南宋都城</span>
        <strong>杭州</strong>
        <em>从六和塔望向临安城</em>
      </div>
    </a>
  </section>

  <section class="home-end">
    <h2 class="home-end-brand">两宋文化地图</h2>
    <p class="home-end-sub">现代地图 · 宋代古地图 · 景点攻略与城市更新</p>
    <a class="home-end-cta" href="map.html">进入地图探索</a>
  </section>

  <footer class="home-foot">
    <span>开封 · 杭州 · 城市更新中的文化传承</span>
  </footer>
  <script src="js/config.js"></script>
  <script src="js/asset-manifest.js"></script>
  <script src="js/preload.js"></script>
  <script>
    document.querySelectorAll('img[src]').forEach(function (img) {
      var s = img.getAttribute('src');
      if (s && s.indexOf('http') !== 0) img.src = assetUrl(s);
    });
  </script>
</body>
</html>
