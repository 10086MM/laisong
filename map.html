<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>地图探索 · 两宋文化地图</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="page-map">
  <div id="app">
    <header class="site-header">
      <a class="brand brand-link" href="index.html" title="返回首页">
        <img class="brand-logo" src="image/brand-logo.jpg" alt="两宋文化">
        <div class="brand-text">
          <h1>两宋文化地图</h1>
          <p>城市更新中的文化传承 · 开封 · 杭州</p>
        </div>
      </a>

      <div class="header-search">
        <div id="search-box" class="search-box">
          <span class="search-icon" aria-hidden="true"></span>
          <input id="search-input" type="text" placeholder="搜索宋文化景点、城市更新地标…" autocomplete="off">
          <button id="search-clear" class="search-clear" type="button" title="清除" hidden>×</button>
        </div>
        <div id="search-dropdown" class="search-dropdown" hidden></div>
      </div>

      <div class="header-actions">
        <div class="city-tabs">
          <button class="city-tab active" data-city="kaifeng">开封 · 北宋</button>
          <button class="city-tab" data-city="hangzhou">杭州 · 南宋</button>
        </div>
        <div id="map-mode-bar" class="map-mode-bar">
          <button class="mode-tab active" data-mode="modern">
            <span>现代地图</span>
          </button>
          <button class="mode-tab" data-mode="ancient">
            <span>宋代古地图</span>
          </button>
        </div>
        <a class="header-home" href="index.html">首页</a>
      </div>
    </header>

    <div class="workspace">
      <aside class="sidebar">
        <div class="sidebar-filters">
          <button class="chip active" data-filter="all">全部 <span class="count" id="count-all">14</span></button>
          <button class="chip" data-filter="song">宋文化 <span class="count" id="count-song">10</span></button>
          <button class="chip" data-filter="renewal">城市更新 <span class="count" id="count-renewal">4</span></button>
        </div>

        <div id="poi-list" class="poi-list"></div>

        <div id="bottom-sheet" class="preview-card">
          <button id="sheet-close" class="sheet-close" title="关闭">×</button>
          <div class="sheet-content">
            <div class="sheet-header">
              <img id="sheet-thumb" class="sheet-thumb" src="" alt="">
              <div class="sheet-info">
                <div class="sheet-name">
                  <span id="sheet-name"></span>
                  <span id="sheet-rating" class="sheet-rating"></span>
                </div>
                <div id="sheet-tags" class="sheet-tags"></div>
                <div id="sheet-address" class="sheet-address"></div>
              </div>
            </div>
            <p id="sheet-intro" class="sheet-intro"></p>
            <div class="sheet-actions">
              <button id="btn-guide" class="btn btn-primary">游览攻略</button>
              <button id="btn-nav" class="btn btn-outline">定位到此</button>
            </div>
          </div>
        </div>
      </aside>

      <main class="map-stage">
        <div id="map-container"></div>
        <div id="ancient-map-container" class="ancient-map-container" aria-hidden="true"></div>

        <div class="map-controls">
          <button id="btn-map-mode" class="ctrl-btn map-mode-btn" title="切换地图">
            <span id="mode-label" class="mode-label">古地图</span>
          </button>
          <button id="btn-locate" class="ctrl-btn locate" title="回到城市中心">⌖</button>
          <button id="btn-zoom-in" class="ctrl-btn" title="放大">+</button>
          <button id="btn-zoom-out" class="ctrl-btn" title="缩小">−</button>
        </div>
      </main>
    </div>

    <div id="detail-panel" class="detail-panel">
      <div class="detail-hero">
        <button id="detail-back" class="detail-back" title="关闭">←</button>
        <img id="detail-hero-img" src="" alt="">
        <div class="detail-hero-overlay"></div>
        <div id="detail-hero-title" class="detail-hero-title"></div>
      </div>
      <div class="detail-body">
        <div id="detail-meta" class="detail-meta"></div>
        <div class="detail-section">
          <h3>景点介绍</h3>
          <p id="detail-intro"></p>
        </div>
        <div class="detail-section">
          <h3>游览攻略</h3>
          <p id="detail-guide"></p>
        </div>
        <div id="detail-renewal-section" class="detail-section">
          <div class="renewal-box">
            <h4>城市更新</h4>
            <p id="detail-renewal"></p>
          </div>
        </div>
      </div>
    </div>

    <div id="search-panel" class="search-panel">
      <div class="search-panel-header">
        <input id="search-panel-input" type="text" placeholder="搜索景点名称、标签…">
        <button id="search-cancel">关闭</button>
      </div>
      <div id="search-results" class="search-results"></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/ancient-maps.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
